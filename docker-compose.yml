services:

  # ─── Banco de Dados ───────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-sustentabilidade_rural}
      POSTGRES_USER:     ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env (rode "make up" para gerar)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-sustentabilidade_rural}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── API Backend ─────────────────────────────────────────────────────────────
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV:           ${NODE_ENV:-production}
      PORT:               3001
      DB_HOST:            db
      DB_PORT:            5432
      DB_NAME:            ${DB_NAME:-sustentabilidade_rural}
      DB_USER:            ${DB_USER:-postgres}
      DB_PASSWORD:        ${DB_PASSWORD:?defina DB_PASSWORD no .env (rode "make up" para gerar)}
      JWT_SECRET:         ${JWT_SECRET:?defina JWT_SECRET no .env (rode "make up" para gerar)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?defina JWT_REFRESH_SECRET no .env (rode "make up" para gerar)}
      FRONTEND_URL:       ${FRONTEND_URL:-http://localhost:5173}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Frontend (Nginx + React) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

# ─── Volumes ─────────────────────────────────────────────────────────────────
volumes:
  pgdata:
